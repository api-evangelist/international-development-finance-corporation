aid: international-development-finance-corporation
name: International Development Finance Corporation
description: >-
  The United States International Development Finance Corporation (DFC) is
  a development finance institution and agency of the United States federal
  government. DFC invests in development projects primarily in lower and
  middle-income countries, providing secure private investment opportunities
  for emerging markets. DFC does not currently expose a public developer
  API portal; transaction-level data is published as downloadable datasets.
